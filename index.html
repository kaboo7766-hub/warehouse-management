<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة المخازن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--c:#fff;--t:#10212e;--m:#617386;--b:#dde4ea;--p:#0b6b73;--pd:#084c52;--in:#15803d;--out:#c2261f;--bgi:#dcf5e5;--bgo:#fde4e2;--h:#f6f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1820;--c:#15252f;--t:#e6eef3;--m:#93a6b4;--b:#26394a;--p:#3fb8c2;--pd:#2a98a2;--in:#4ade80;--out:#f87171;--bgi:#123824;--bgo:#40191a;--h:#192d3a}}
:root[data-theme="dark"]{--bg:#0d1820;--c:#15252f;--t:#e6eef3;--m:#93a6b4;--b:#26394a;--p:#3fb8c2;--pd:#2a98a2;--in:#4ade80;--out:#f87171;--bgi:#123824;--bgo:#40191a;--h:#192d3a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
header{background:var(--pd);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header .lg{background:rgba(255,255,255,.15);border-radius:10px;padding:8px;display:flex}
header h1{font-size:20px;margin:0;font-weight:800}
header small{opacity:.8;display:block;font-size:12px;font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);padding:6px 12px;position:sticky;top:0;z-index:5}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--m);font:600 14px Cairo,Tahoma,sans-serif;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--h)}.tab.on{background:var(--p);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h2{font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px}
.pc{border-top:4px solid var(--pc)}
.ph{display:flex;align-items:center;gap:8px;color:var(--pc);font-size:15px}.ph b{color:var(--t)}
.big{font-size:28px;font-weight:800;margin:6px 0 2px}.big small{font-size:13px;color:var(--m);font-weight:600}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:600}
.up{color:var(--in);display:flex;gap:4px;align-items:center}.dn{color:var(--out);display:flex;gap:4px;align-items:center}
.sub{color:var(--m);font-size:12px;margin-top:4px}
.st{display:flex;align-items:center;gap:12px}.st .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--h);color:var(--p)}
.st b{font-size:22px;display:block;line-height:1.2}.st span{color:var(--m);font-size:13px}
form .sec{font-weight:700;color:var(--p);display:flex;gap:7px;align-items:center;margin:4px 0 10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--m)}
label .i{margin-inline-end:4px}
input,select,textarea{width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:10px 20px;font:700 14px Cairo,Tahoma,sans-serif;cursor:pointer;color:#fff;background:var(--p)}
.btn:hover{background:var(--pd)}.btn.out{background:var(--out)}
.av{display:inline-block;margin-inline-start:14px;color:var(--m);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:12px;background:var(--c)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--b);vertical-align:top;font-size:14px}
th{background:var(--h);color:var(--m);font-size:13px}tr:last-child td{border-bottom:0}
.bd{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.bd.in{background:var(--bgi);color:var(--in)}.bd.out{background:var(--bgo);color:var(--out)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.x{border:1px solid var(--b);background:none;color:var(--out);border-radius:8px;padding:5px 9px;cursor:pointer;font:600 12px Cairo,Tahoma,sans-serif;display:inline-flex;gap:4px;align-items:center}
.x:hover{background:var(--bgo)}
.emp{padding:30px;text-align:center;color:var(--m)}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fl>*{flex:1;min-width:160px}
.num{font-weight:700;white-space:nowrap}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--in);color:#fff;padding:11px 20px;border-radius:10px;font-weight:700;display:none;z-index:20;max-width:90%;text-align:center}
#toast.e{background:var(--out)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 21V7"/><path d="m6 13 6-6 6 6"/><path d="M19 3H5"/></symbol>
<symbol id="i-wh" viewBox="0 0 24 24"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/><rect x="6" y="10" width="12" height="12"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-ship" viewBox="0 0 24 24"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.4 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.9 5.3 2.8 7.8"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10v4"/><path d="M12 2v3"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
<symbol id="i-wheat" viewBox="0 0 24 24"><path d="M12 22V9"/><path d="M12 9c-2.5-2-2.5-5 0-7 2.5 2 2.5 5 0 7Z"/><path d="M12 15c-3.2 0-5.2-2.2-5.2-5.2 3.2 0 5.2 2.2 5.2 5.2Z"/><path d="M12 15c3.2 0 5.2-2.2 5.2-5.2-3.2 0-5.2 2.2-5.2 5.2Z"/><path d="M12 20c-3.2 0-5.2-2.2-5.2-5.2 3.2 0 5.2 2.2 5.2 5.2Z"/><path d="M12 20c3.2 0 5.2-2.2 5.2-5.2-3.2 0-5.2 2.2-5.2 5.2Z"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
<symbol id="i-sheet" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
</defs></svg>

<header><div class="lg"><svg class="i" width="28" height="28"><use href="#i-wh"/></svg></div><div><h1>نظام إدارة المخازن</h1><small>الذرة وكسب عباد الشمس: وارد ومنصرف وأرصدة المخازن</small></div><button class="hb" id="hb" style="display:none" title="ربط جوجل شيت" aria-label="ربط جوجل شيت" onclick="gsOpen()"><svg class="i" width="22" height="22"><use href="#i-sheet"/></svg></button>
<div id="ses"></div>
<div class="usr"><svg class="i" width="18" height="18"><use href="#i-user"/></svg>tarek mohsen</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="auth"></div>
<div id="gsm" onclick="if(event.target===this)gsClose()"></div>
<div id="toast" role="status"></div>

<style>
.pg{height:8px;background:var(--b);border-radius:99px;overflow:hidden}.pg i{display:block;height:100%;background:var(--pc,var(--p))}
.hint{color:var(--m);font-size:13px;margin:-4px 0 10px}
.btn.sm{padding:5px 11px;font-size:12px}
.hb{margin-inline-start:auto;background:#fff;color:#188038;border:0;border-radius:10px;padding:8px;display:flex;cursor:pointer}.hb:hover{background:#e6f4ea}.hb{position:relative}.hb.ok::after,.hb.er::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:#188038}.hb.er::after{background:#c2261f}
#gsm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;padding:16px;overflow:auto}#gsm.on{display:block}#gsm .box{max-width:660px;margin:16px auto;background:var(--c);border-radius:14px;padding:18px;border:1px solid var(--b)}
#gsc{font-family:Consolas,monospace;font-size:12px;direction:ltr;text-align:left;white-space:pre}
@media(max-width:520px){header{padding:12px}header small{display:none}header h1{font-size:17px}.usr{padding:6px 10px;font-size:13px}}
body.sup .x{display:none}
#ld{padding:40px;text-align:center;color:var(--m)}
.usr{white-space:nowrap;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:7px 14px;border-radius:99px;font-weight:700;direction:ltr;font-size:14px}
.btn.alt{background:var(--c);color:var(--p);border:1px solid var(--p)}.btn.alt:hover{background:var(--h)}
#auth{display:none;position:fixed;inset:0;background:var(--bg);z-index:25;padding:16px;overflow:auto}#auth.on{display:block}#auth .box{max-width:420px;margin:50px auto 0;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:20px}
#ses{display:flex;gap:8px;align-items:center;font-size:13px}#ses .sn{display:flex;gap:5px;align-items:center}#ses .lo{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:5px 10px;cursor:pointer;font:600 12px Cairo,Tahoma,sans-serif}
@media(max-width:520px){#ses .sn{display:none}}
#xo{font-family:Consolas,monospace;font-size:12px;white-space:pre;direction:ltr;text-align:left}
</style>
<script>
const PR=[
{id:'brc',n:'ذرة برازيلي',c:'#16a34a',k:'wheat'},
{id:'arc',n:'ذرة أرجنتيني',c:'#0ea5e9',k:'wheat'},
{id:'ukc',n:'ذرة أوكراني',c:'#d4a106',k:'wheat'},
{id:'rus',n:'كسب عباد روسي',c:'#b45309',k:'bag'},
{id:'uks',n:'كسب عباد أوكراني',c:'#8b5cf6',k:'bag'}];
const SH=[['1','الوردية الأولى'],['2','الوردية الثانية']];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3=n=>Math.round(n*1000)/1000;
const f=n=>r3(n).toLocaleString('en-US',{maximumFractionDigits:3});
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const uq=a=>[...new Set(a.filter(Boolean))];
const ic=(n,s)=>`<svg class="i" width="${s||18}" height="${s||18}"><use href="#i-${n}"/></svg>`;
const P=id=>PR.find(p=>p.id===id)||PR[0];
const SHN=s=>(SH.find(a=>a[0]===s)||[0,'—'])[1];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(m,k){const t=$('toast');t.textContent=m;t.className=k==='e'?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.display='none'},3200);return false}

function go(k){tab=k;pend=null;render();window.scrollTo(0,0)}

function pOpts(sel){return PR.map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${p.n}</option>`).join('')}

function wOpts(pid){const l=S.w.filter(w=>w.p===pid);return l.length?l.map(w=>`<option value="${w.id}">${esc(w.n)}</option>`).join(''):'<option value="">لا توجد مخازن لهذا الصنف</option>'}

function dl(id,a){return`<datalist id="${id}">${uq(a).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}

function upd(sel){const F=sel.form;if(sel.name==='p')F.elements.w.innerHTML=wOpts(sel.value);const a=$('av');if(a){const w=F.elements.w.value;a.textContent=w?'المتاح في المخزن: '+f(st(w))+' طن':''}}

function vcard(id){const v=vid(id);if(!v)return'';const p=P(v.p),s=stV(id),pc=v.q>0?Math.min(100,s/v.q*100):0;
 return`<div class="card pc" style="--pc:${p.c}"><div class="ph">${ic('ship',20)}<b>${esc(v.vessel)}</b></div><div class="sub">رصيف ${esc(v.berth||'—')} · ${esc(v.sup)} · ${p.n}</div><div class="pg" style="margin:10px 0 6px"><i style="width:${pc}%"></i></div><div class="mini"><span>الكلية ${f(v.q)}</span><span class="up">المخزَّن ${f(s)}</span><span class="dn">المتبقي ${f(r3(v.q-s))} طن</span></div></div>`}


function tbl(list,del){
 if(!list.length)return`<div class="tw"><div class="emp">${ic('box',32)}<br>لا توجد حركات مسجلة بعد</div></div>`;
 const rows=[...list].sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(x=>{
  const p=P(x.p),i=x.ty==='inc';let det;
  if(i){const v=vid(x.v)||{};det=`${ic('ship',14)} <b>${esc(v.vessel||'—')}</b> · رصيف ${esc(v.berth||'—')}<br><small>${SHN(x.sh)} · ${x.trucks?x.trucks+' سيارة × '+f(x.avg)+' طن':'بدون تفاصيل سيارات'}</small>`}
  else det=`${ic('user',14)} <b>${esc(x.to||'—')}</b>${x.car?`<br><small>${ic('truck',13)} ${esc(x.car)}</small>`:''}`;
  const b=del?`<td><button class="x" onclick="delTx('${x.id}')">${ic('trash',14)}${pend===x.id?'تأكيد الحذف؟':'حذف'}</button></td>`:'';
  return`<tr><td><span class="bd ${i?'in':'out'}">${ic(i?'down':'up',13)}${i?'تخزين':'منصرف'}</span></td><td class="num">${esc(x.d)}</td><td><span class="dot" style="background:${p.c}"></span>${p.n}</td><td>${esc(wn(x.w))}</td><td class="num" style="color:var(${i?'--in':'--out'})">${i?'+':'−'}${f(x.q)} طن</td><td>${det}${x.note?`<br><small style="color:var(--m)">${esc(x.note)}</small>`:''}</td>${b}</tr>`}).join('');
 return`<div class="tw"><table><thead><tr><th>النوع</th><th>التاريخ</th><th>الصنف</th><th>المخزن</th><th>الكمية</th><th>التفاصيل</th>${del?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`}


function vDash(){
 const tin=r3(S.s.reduce((a,x)=>a+x.q,0)),tout=r3(S.t.reduce((a,x)=>a+x.q,0)),rem=r3(S.v.reduce((a,v)=>a+remV(v.id),0));
 const stats=[['box','رصيد المخازن',f(tin-tout)],['down','إجمالي المخزَّن',f(tin)],['up','إجمالي المنصرف',f(tout)],['ship','متبقي على المراكب',f(rem)]].map(s=>`<div class="card st"><div class="ic">${ic(s[0],24)}</div><div><b>${s[2]} <small>طن</small></b><span>${s[1]}</span></div></div>`).join('');
 const cards=PR.map(p=>{const a=sumP(p.id,'inc'),o=sumP(p.id,'outc'),n=S.w.filter(w=>w.p===p.id).length;
  return`<div class="card pc" style="--pc:${p.c}"><div class="ph">${ic(p.k,22)}<b>${p.n}</b></div><div class="big">${f(a-o)}<small> طن</small></div><div class="mini"><span class="up">${ic('down',14)}مخزَّن ${f(a)}</span><span class="dn">${ic('up',14)}منصرف ${f(o)}</span></div><div class="sub">${n} مخزن</div></div>`}).join('');
 const wr=S.w.slice().sort((a,b)=>PR.findIndex(p=>p.id===a.p)-PR.findIndex(p=>p.id===b.p)).map(w=>`<tr><td><span class="dot" style="background:${P(w.p).c}"></span>${P(w.p).n}</td><td>${esc(w.n)}</td><td class="num">${f(sumW(w.id,'inc'))}</td><td class="num">${f(sumW(w.id,'outc'))}</td><td class="num"><b>${f(st(w.id))}</b> طن</td></tr>`).join('');
 const ov=S.v.filter(v=>remV(v.id)>0).slice(-6).map(v=>vcard(v.id)).join('');
 return`<div class="grid g5">${stats}</div><h2>${ic('wheat',20)}أرصدة الأصناف</h2><div class="grid g5">${cards}</div>
 ${ov?`<h2>${ic('ship',20)}مراكب قيد التفريغ</h2><div class="grid g3">${ov}</div>`:''}
 <h2>${ic('truck',20)}تخزين اليوم حسب الوردية</h2>${todayRpt()}
 <h2>${ic('wh',20)}أرصدة المخازن</h2><div class="tw"><table style="min-width:560px"><thead><tr><th>الصنف</th><th>المخزن</th><th>المخزَّن</th><th>المنصرف</th><th>الرصيد</th></tr></thead><tbody>${wr||'<tr><td colspan="5" class="emp">لا توجد مخازن</td></tr>'}</tbody></table></div>
 <h2>${ic('list',20)}آخر الحركات</h2>${tbl(all().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,6),false)}`}


function vInc(){
 const rows=S.v.slice().reverse().map(v=>{const p=P(v.p),s=stV(v.id),r=r3(v.q-s),pc=v.q>0?Math.min(100,s/v.q*100):0;

async function importData(){bkv=$('bki').value;let d;try{d=JSON.parse(bkv)}catch(e){return toast('النص غير صالح','e')}
 if(!(d&&Array.isArray(d.w)&&Array.isArray(d.t)&&Array.isArray(d.v)&&Array.isArray(d.s)))return toast('النص غير صالح كنسخة من النسخة القديمة','e');
 if(!arm('imp'))return;
 const ops=[];let i=0;const now=Date.now();
 const add=(c,r)=>{const x=JSON.parse(JSON.stringify(r));if(!x||!x.id)return;x.ca=now+(i++);ops.push({t:'set',c:c,id:String(x.id),d:x})};
 (d.x||[]).forEach(r=>add('products',r));d.w.forEach(r=>add('warehouses',r));d.v.forEach(r=>add('vessels',r));d.s.forEach(r=>add('stored',r));d.t.forEach(r=>add('outgoing',{...r,ty:'outc'}));
 ops.push({t:'set',c:'meta',id:'seeded',d:{ok:true,ca:now}});
 try{await DB.batch(ops);bkv='';toast('تم استيراد '+(ops.length-1)+' سجل');render()}catch(e){toast('تعذر الاستيراد: '+errTxt(e),'e')}}

function tabsFor(){const t=[['dash','لوحة التحكم','dash'],['inc','المراكب','ship'],['sto','التخزين اليومي','box'],['outc','المنصرف','up']];
 if(isAdmin())t.push(['wh','المخازن والأصناف','wh']);t.push(['log','سجل الحركات','list']);
 if(isAdmin())t.push(['usr','المستخدمون','user'],['lgn','سجل الدخول','cal'],['bk','التصدير والاستيراد','sheet']);return t}
function render(){
 const tb=tabsFor();if(!tb.some(t=>t[0]===tab))tab='dash';

 if(!ME){$('app').innerHTML='';return}
 if(!['w','v','s','t','x'].every(k=>loaded[k])){$('app').innerHTML='<div id="ld">جارٍ تحميل البيانات...</div>';return}

const typing=()=>{const a=document.activeElement;return!!a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&$('app').contains(a)};
function sched(){if(rt)return;rt=setTimeout(()=>{rt=0;if(typing()){pendR=true;return}render();gsAuto()},80)}

function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];loaded={};seedChecked=false;S={w:[],t:[],v:[],s:[],x:[],l:[],u:[]};syncPR()}
function startListeners(){stopAll();const cols={...MAP};if(isAdmin()){cols.u='allowed';cols.l='logins'}
 Object.keys(cols).forEach(k=>{unsubs.push(DB.listen(cols[k],rows=>{S[k]=rows.sort((a,b)=>(a.ca||0)-(b.ca||0));if(k==='x')syncPR();loaded[k]=1;
  if(k==='w'&&!seedChecked){seedChecked=true;if(isAdmin()&&rows.length===0)seed()}sched()},e=>toast('تعذر قراءة البيانات ('+cols[k]+'): '+errTxt(e),'e')))})}
async function seed(){try{if(await DB.get('meta','seeded'))return;const now=Date.now();
 const ops=PR.slice(0,5).map((p,i)=>({t:'set',c:'warehouses',id:'w'+(i+1),d:{id:'w'+(i+1),n:'مخزن '+(i+1),p:p.id,ca:now+i}}));

function hideGate(){$('auth').className=''}
function showGate(step,msg,err){const g=$('auth');g.className='on';
 const warn=/^https?:$/.test(location.protocol)?'':'<div class="hint" style="color:var(--out)">افتح البرنامج من رابط الاستضافة (https) وليس من ملف على الجهاز، وإلا لن يعمل الدخول.</div>';
 g.innerHTML=`<div class="box"><div class="sec">${ic('user',22)}تسجيل الدخول</div><div class="hint" style="margin:0 0 14px">ادخل بحساب جوجل (Gmail) المسجل عند المدير.</div>${warn}<button class="btn" id="gbtn" onclick="googleLogin()">${ic('user',18)}الدخول بحساب جوجل</button><div id="am" class="hint" style="margin-top:12px;color:${err?'var(--out)':'var(--m)'}">${esc(msg||'')}</div></div>`}
async function googleLogin(){if(authBusy)return;
 if(!/^https?:$/.test(location.protocol))return amsg('افتح البرنامج من رابط الاستضافة (https) وليس من ملف على الجهاز.',1);
 if(!window.DB)return amsg('جارٍ تحميل خدمات Firebase، حاول بعد لحظات.',1);
 authBusy=true;amsg('جارٍ فتح نافذة جوجل...');
 try{await DB.google()}catch(e){amsg(errTxt(e),1)}finally{authBusy=false}}
async function enter(u){if(entering)return;entering=true;
 try{if(!u.email||u.verified===false){gateMsg='حساب جوجل غير موثّق.';gateErr=1;await DB.signOut();return}
  let al=null,fail=null;
  try{al=await DB.get('allowed',u.email)}catch(e){fail=e}
  if(fail&&fail.code!=='permission-denied'){showGate('g','تعذر التحقق من الصلاحية: '+errTxt(fail)+'. تأكد من الإنترنت وأعد المحاولة.',1);return}
  if(!al&&u.email===ADMIN){al={name:u.name||'المدير',role:'admin',active:true,ca:Date.now()};try{await DB.set('allowed',u.email,al)}catch(e){}}
  if(!al||al.active===false){gateMsg='هذا الحساب ('+u.email+') غير مسجل أو موقوف. اطلب من المدير إضافته.';gateErr=1;await DB.signOut();return}
  ME={uid:u.uid,email:u.email,name:al.name||u.name||u.email,role:(al.role==='admin'||u.email===ADMIN)?'admin':'sup'};
  document.body.classList.toggle('sup',!isAdmin());$('hb').style.display=isAdmin()?'flex':'none';
  hideGate();lastAct=Date.now();startListeners();updSes();render();startBeat();await openLogin()}
 catch(e){showGate('g','تعذر الدخول: '+errTxt(e),1)}finally{entering=false}}
async function openLogin(){let sid='';try{sid=localStorage.getItem('wms_sid')||''}catch(e){}
 try{if(sid){const r=await DB.get('logins',sid);if(r&&r.uid===ME.uid&&!r.logoutMs){SID=sid;DB.update('logins',sid,{lastMs:Date.now()}).catch(()=>{});return}}}catch(e){}
 SID=uid();try{localStorage.setItem('wms_sid',SID)}catch(e){}
 const now=Date.now();DB.set('logins',SID,{id:SID,uid:ME.uid,email:ME.email,name:ME.name,role:ME.role,loginMs:now,lastMs:now,logoutMs:0,method:'',ca:now}).catch(()=>{})}
async function doLogout(m){if(!ME)return;const sid=SID;clearInterval(hbT);if(m==='خمول'){gateMsg='تم تسجيل الخروج بسبب عدم النشاط';gateErr=0}
 try{if(sid)await Promise.race([DB.update('logins',sid,{logoutMs:Date.now(),lastMs:Date.now(),method:m||'يدوي'}),new Promise(r=>setTimeout(r,4000))])}catch(e){}
 try{localStorage.removeItem('wms_sid')}catch(e){}
 try{await DB.signOut()}catch(e){}}
function startBeat(){clearInterval(hbT);tick=0;hbT=setInterval(()=>{if(!ME)return;if(Date.now()-lastAct>IDLE){doLogout('خمول');return}if(++tick%8===0&&SID)DB.update('logins',SID,{lastMs:Date.now()}).catch(()=>{})},30000)}
['click','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
addEventListener('pagehide',()=>{if(ME&&SID&&window.DB)try{DB.update('logins',SID,{lastMs:Date.now()}).catch(()=>{})}catch(e){}});
function boot(){DB.onAuth(u=>{
 if(!u){stopAll();ME=null;SID='';document.body.classList.remove('sup');$('hb').style.display='none';updSes();render();const m=gateMsg,er=gateErr;gateMsg='';gateErr=0;showGate('phone',m,er);return}
 enter(u)})}

function doPost(e) {
  var lock = LockService.getScriptLock();

      }
      counts[name] = Math.max(rows.length - 1, 0);
